name: Build LibertyUV Android
on:
  push:
    branches: [libertyuv-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test and build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          arguments: testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LibertyUV-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: libertyuv-build-${{ github.run_number }}
          name: LibertyUV Android build ${{ github.run_number }}
          body: "APK de desarrollo. No instalar en una consola ni modificar archivos originales hasta validar XMem/LZX y reconstrucción."
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
