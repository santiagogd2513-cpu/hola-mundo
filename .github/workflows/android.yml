name: LibertyV Android (APK)

on:
  push:
    paths:
      - 'libertyv-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: libertyv-android
    env:
      NDK_VERSION: 27.2.12479018
      FFMPEG_VERSION: 7.1.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar NDK y CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Caché de FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: libertyv-android/ffmpeg-android
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-ndk${{ env.NDK_VERSION }}-${{ hashFiles('libertyv-android/scripts/build-ffmpeg.sh') }}

      - name: Compilar FFmpeg (XMA2 + MP3)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg.sh

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Pruebas de la librería
        run: gradle :core:test --no-daemon --stacktrace

      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: LibertyV-android
          path: libertyv-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
