name: BD Files (APK)

on:
  push:
    paths:
      - 'bd-files/**'
      - '.github/workflows/bdfiles.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: bd-files

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Preparar SDK de Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Pruebas
        run: gradle :app:testDebugUnitTest -PbuildNumber=${{ github.run_number }} --no-daemon --stacktrace

      - name: Compilar APK
        run: gradle :app:assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/BD-Files-v1.0-build${{ github.run_number }}.apk"
          ls -la out

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: BD-Files
          path: bd-files/out/*.apk
          if-no-files-found: error
